<!doctype html>
<html lang="es-AR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO principal -->
  <title>Dblock | Desarrollo Web, SEO y Soluciones Digitales</title>
  <meta
    name="description"
    content="Dblock desarrolla sitios web, SEO, aplicaciones, cloud y automatización para empresas que buscan crecer digitalmente."
  />
  <meta
    name="keywords"
    content="desarrollo web, páginas web para empresas, SEO, aplicaciones web, aplicaciones móviles, infraestructura digital, Dblock"
  />
  <meta name="author" content="Dblock" />
  <meta name="robots" content="index, follow, max-image-preview:large" />

  <!-- Canonical -->
  <link rel="canonical" href="https://dblock.com.ar/" />
  <link rel="preload" href="/assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Favicon PNG -->
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Color del navegador en mobile -->
  <meta name="theme-color" content="#0e0e0f" />

  <!-- Open Graph: Facebook, WhatsApp, LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dblock | Desarrollo Web, SEO y Soluciones Digitales" />
  <meta
    property="og:description"
    content="Desarrollo web, SEO, cloud y automatización para empresas que buscan crecer digitalmente."
  />
  <meta property="og:url" content="https://dblock.com.ar/" />
  <meta property="og:site_name" content="Dblock" />
  <meta property="og:image" content="https://dblock.com.ar/assets/images/cloud-infrastructure.jpg" />
  <meta property="og:locale" content="es_AR" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Dblock | Desarrollo Web, SEO y Soluciones Digitales" />
  <meta
    name="twitter:description"
    content="Desarrollo web, SEO, cloud y automatización para empresas que buscan crecer digitalmente."
  />
  <meta name="twitter:image" content="https://dblock.com.ar/assets/images/cloud-infrastructure.jpg" />

  <!-- Datos estructurados del sitio y del servicio -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://dblock.com.ar/#website",
          "name": "Dblock",
          "alternateName": "DBLOCK",
          "url": "https://dblock.com.ar/",
          "inLanguage": "es-AR"
        },
        {
          "@type": "ProfessionalService",
          "@id": "https://dblock.com.ar/#business",
          "name": "Dblock",
          "url": "https://dblock.com.ar/",
          "logo": "https://dblock.com.ar/logo.png",
          "email": "ventas@dblock.com.ar",
          "description": "Dblock desarrolla sitios web, SEO, aplicaciones, cloud y automatización para empresas.",
          "areaServed": {
            "@type": "Country",
            "name": "Argentina"
          },
          "serviceType": [
            "Desarrollo web",
            "SEO",
            "Aplicaciones web",
            "Aplicaciones móviles",
            "Infraestructura digital",
            "Automatización de procesos"
          ]
        }
      ]
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
